<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almoxarifado — Estoque</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <!-- ===== Cabeçalho ===== -->
  <div class="header">
    <div class="logo"><i class="ti ti-building-warehouse"></i></div>
    <div class="header-text">
      <h1>Estoque</h1>
      <p>Relatórios e histórico de movimentações</p>
    </div>
    <div id="usuario-logado"></div>
    <div id="status-db" class="db-status db-conectando">Conectando...</div>

    <!-- Botão de navegação — visível só para admin -->
    <div id="nav-admin" style="display:none; gap:6px; flex-wrap:wrap;">
      <a href="scanner.html" class="btn-nav">
        <i class="ti ti-barcode"></i>Scanner / Cadastro
      </a>
      <a href="futuro.html" class="btn-nav">
        <i class="ti ti-layout-grid"></i>Em breve
      </a>
    </div>
  </div>

  <!-- ===== Stats ===== -->
  <div class="stats">
    <div class="stat"><div class="stat-label">Total de itens</div><div class="stat-value" id="stat-total">—</div></div>
    <div class="stat"><div class="stat-label">Entradas hoje</div><div class="stat-value success" id="stat-entradas">—</div></div>
    <div class="stat"><div class="stat-label">Saídas hoje</div><div class="stat-value danger" id="stat-saidas">—</div></div>
    <div class="stat"><div class="stat-label">Estoque baixo</div><div class="stat-value danger" id="stat-baixo">—</div></div>
  </div>

  <!-- ===== Tabs ===== -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('estoque', this)">
      <i class="ti ti-package"></i>Estoque
    </button>
    <button class="tab" onclick="showTab('historico', this)">
      <i class="ti ti-history"></i>Histórico
    </button>
  </div>

  <!-- ===================================================
       ABA: ESTOQUE
  ==================================================== -->
  <div id="tab-estoque" class="section active">

    <div class="search-row">
      <input type="text" id="search-estoque"
             placeholder="Buscar por nome, código ou categoria..."
             oninput="renderEstoque()" />
      <select id="filter-estoque" onchange="renderEstoque()">
        <option value="">Todos os itens</option>
        <option value="baixo">Estoque baixo</option>
        <option value="ok">Estoque OK</option>
      </select>
      <button onclick="carregarMateriais(true)" title="Atualizar">
        <i class="ti ti-refresh"></i>
      </button>
      <button onclick="exportarExcelMensal()">
        <i class="ti ti-file-spreadsheet"></i>Relatório CSV
      </button>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="text-align:center;">Material</th>
              <th style="text-align:center;">Categoria</th>
              <th style="text-align:center;">Estoque</th>
              <th style="text-align:center;">Mín.</th>
              <th style="text-align:center;">Unidade</th>
              <th style="text-align:center;">Status</th>
            </tr>
          </thead>
          <tbody id="tb-estoque">
            <tr><td colspan="6" class="empty">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div><!-- /tab-estoque -->

  <!-- ===================================================
       ABA: HISTÓRICO
  ==================================================== -->
  <div id="tab-historico" class="section">

    <div class="hist-filters">
      <select id="hist-tipo" onchange="renderHistorico()">
        <option value="">Todos os tipos</option>
        <option value="entrada">Somente entradas</option>
        <option value="saida">Somente saídas</option>
      </select>
      <input type="text" id="hist-busca"
             placeholder="Buscar por material, código ou responsável..."
             oninput="renderHistorico()" />
      <button onclick="carregarHistorico(true)">
        <i class="ti ti-refresh"></i>Atualizar
      </button>
      <button onclick="exportarCSV()">
        <i class="ti ti-download"></i>Exportar CSV
      </button>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="text-align:center;">Data/Hora</th>
              <th style="text-align:center;">Material</th>
              <th style="text-align:center;">Qtd</th>
              <th style="text-align:center;">Tipo</th>
              <th style="text-align:center;">Responsável</th>
            </tr>
          </thead>
          <tbody id="tb-historico">
            <tr><td colspan="5" class="empty">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div><!-- /tab-historico -->

</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="database.js"></script>
<script src="Usuario.js"></script>
<script src="relatorio.js"></script>
<script src="app.js"></script>

</body>
</html>
